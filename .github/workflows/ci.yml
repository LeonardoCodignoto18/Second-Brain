name: foundation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, validation/spk-01-windows-x64]

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          components: clippy,rustfmt
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify foundation
        shell: pwsh
        run: scripts/check.ps1

  spk01-windows-x64:
    if: github.ref == 'refs/heads/validation/spk-01-windows-x64' || github.head_ref == 'validation/spk-01-windows-x64'
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        working-directory: spikes/SPK-01-sqlcipher-windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1-x86_64-pc-windows-msvc
      - name: Record independent runner
        shell: pwsh
        run: |
          $PSVersionTable
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber, OsArchitecture
          rustc --version --verbose
          cargo --version
          perl --version
      - name: Verify locked dependency chain
        shell: pwsh
        run: |
          cargo tree --locked -i libsqlite3-sys
          cargo tree --locked -i openssl-sys
      - name: Build and run SPK-01 tests
        run: cargo test --locked --all-targets --verbose
      - name: Build release probe
        run: cargo build --release --locked --verbose
      - name: Install frozen Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Build NSIS package
        run: cargo tauri build --bundles nsis
      - name: Verify binaries and native linkage
        shell: pwsh
        run: |
          $exe = Resolve-Path ../../target/release/spk01-tauri-probe.exe
          Get-FileHash $exe -Algorithm SHA256
          $installer = Get-ChildItem ../../target/release/bundle/nsis/*.exe | Select-Object -First 1
          Get-FileHash $installer.FullName -Algorithm SHA256
          $unexpected = Get-ChildItem ../../target/release -File | Where-Object { $_.Name -match '(?i)(sqlcipher|sqlite3|libcrypto|libssl).*\.dll$' }
          if ($unexpected) { $unexpected | Format-Table; throw 'Unexpected SQLCipher/OpenSSL DLL found' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $dumpbin = & $vswhere -latest -products * -find '**/dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe not found in the Visual Studio installation' }
          & $dumpbin /dependents $exe
      - name: Upload short-lived evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spk01-windows-x64-evidence-${{ github.run_id }}
          path: |
            target/release/spk01-tauri-probe.exe
            target/release/bundle/nsis/*.exe
          retention-days: 3
          if-no-files-found: warn
