[package]
name = "spk01-sqlcipher-windows"
version = "0.0.0"
edition = "2024"
publish = false
default-run = "spk01-tauri-probe"

[lib]
name = "spk01_sqlcipher_windows"
path = "src/lib.rs"

[[bin]]
name = "spk01-tauri-probe"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
hex = "0.4.3"
rand = "0.9.2"
rusqlite = { version = "0.40.0", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0.228", features = ["derive"] }
tauri = { version = "2.10.2", features = [] }
tempfile = "3.23.0"
thiserror = "2.0.17"
